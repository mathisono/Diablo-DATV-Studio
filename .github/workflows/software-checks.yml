name: Software checks (no hardware output)
on:
  workflow_dispatch:
  push:
    branches: [Trixie]
  pull_request:
    branches: [Trixie]
permissions:
  contents: read
jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libjson-c-dev libusb-1.0-0-dev libfftw3-dev ffmpeg curl python3
      - name: Bootstrap private runtime
        run: bash scripts/install-diablo.sh --prefix "$RUNNER_TEMP/diablo" --skip-system-packages
      - name: Hardware-free regression tests
        run: |
          export DIABLO_TEST_RUNTIME="$RUNNER_TEMP/diablo/runtime"
          export LD_LIBRARY_PATH="$DIABLO_TEST_RUNTIME/lib"
          export UCODE="$DIABLO_TEST_RUNTIME/bin/ucode"
          export UCODE_MODULE_DIR="$DIABLO_TEST_RUNTIME/lib/ucode"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Experimental S2 build and offline rate calculation
        run: |
          bash scripts/build-express-s2.sh
          src/express_s2/express_s2 --rate-only --symbol-rate 1000000 --fec 1/2
      - name: JavaScript syntax
        run: node --check www/app.js
